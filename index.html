<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        },
                        accent: {
                            yellow: '#f59e0b',
                            green: '#10b981',
                            purple: '#8b5cf6',
                            pink: '#ec4899',
                        }
                    },
                    animation: {
                        'bounce-short': 'bounce 0.5s ease-in-out 1',
                        'shake': 'shake 0.4s ease-in-out',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'pulse-glow': 'pulseGlow 2s infinite',
                    },
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '20%, 60%': { transform: 'translateX(-8px)' },
                            '40%, 80%': { transform: 'translateX(8px)' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(14, 165, 233, 0.4)' },
                            '50%': { boxShadow: '0 0 30px rgba(14, 165, 233, 0.8)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Mobile Touch Optimizations */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
        }
        .touch-action-manipulation {
            touch-action: manipulation;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
    </style>
</head>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        /* ==========================================================================
           AUDIO SYNTHESIZER (Web Audio API - No external assets required)
           ========================================================================== */
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playCorrect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.35);
            }

            playWrong() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            }

            playLevelUp() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const notes = [440, 554.37, 659.25, 880]; // A4, C#5, E5, A5
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.3);
                });
            }

            playFanfare() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

        let gameState = {
            score: 0,
            xp: 0,
            level: 1,
            streak: 0,
            maxStreak: 0,
            weakList: [], // Array of question objects
            history: {}, // qKey -> { correct: count, wrong: count }

            mode: 'chapter', // 'chapter', 'final', 'weak'

        /* ==========================================================================
           PERSISTENCE (LocalStorage)
           ========================================================================== */
        function loadSavedState() {
            try {
                const saved = localStorage.getItem('channel_master_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                }
            } catch (e) {
                console.error("Could not load state", e);
            }
            updateHeaderUI();
            renderHomeSummary();
        }

        function saveState() {
            try {
                localStorage.setItem('channel_master_state', JSON.stringify(gameState));
            } catch (e) {
                console.error("Could not save state", e);
            }
        }

        /* ==========================================================================
           NAVIGATION & SCREEN CONTROLLER
           ========================================================================== */
        function showScreen(screenId) {
            const screens = ['home', 'chapters', 'quiz', 'result', 'dictionary'];
            screens.forEach(s => {
                const el = document.getElementById(`screen-${s}`);
                if (el) el.classList.add('hidden');
            });

            const target = document.getElementById(`screen-${screenId}`);
            if (target) {
                target.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            if (screenId === 'home') {
                renderHomeSummary();
                updateHeaderUI();
            } else if (screenId === 'chapters') {
                renderChapterSelection();
            } else if (screenId === 'dictionary') {
                renderDictionary();
            }
        }

        /* ==========================================================================
           HOME & DASHBOARD RENDERERS
           ========================================================================== */
        function getLevelTitle(lvl) {
            if (lvl < 3) return "見習いマーケター";
            if (lvl < 6) return "流通のホープ";
            if (lvl < 10) return "チャネルアナリスト";
            if (lvl < 15) return "サプライチェーン達人";
            return "チャネルマスター★";
        }

        function updateHeaderUI() {
            document.getElementById('header-level').innerText = `Lv.${gameState.level}`;
            document.getElementById('header-streak').innerText = gameState.streak;
            document.getElementById('user-title').innerText = getLevelTitle(gameState.level);
            document.getElementById('total-score-display').innerText = gameState.score.toLocaleString();

            // XP Calculation: 100 XP per level
            const currentLevelXp = gameState.xp % 100;
            document.getElementById('level-label').innerText = `Level ${gameState.level}`;
            document.getElementById('xp-label').innerText = `${currentLevelXp} / 100 XP`;
            document.getElementById('xp-bar').style.width = `${currentLevelXp}%`;

            // Calculate Overall Mastery
            let totalQ = 0;
            let totalCorrect = 0;
            Object.values(gameState.history).forEach(h => {
                totalQ++;
                if (h.correct > 0) totalCorrect++;
            });
            const mastery = totalQ > 0 ? Math.min(100, Math.round((totalCorrect / 80) * 100)) : 0;
            document.getElementById('overall-mastery-text').innerText = `${mastery}%`;

            // Update weak questions label
            document.getElementById('weak-count-label').innerText = `間違えた問題 (${gameState.weakList.length})`;
        }

        /* ==========================================================================
           QUIZ ENGINE & LOGIC
           ========================================================================== */
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startChapterQuiz(chId) {
            const baseQ = quizDatabase[chId] || [];
            currentSession = {
                mode: 'chapter',
                chapterId: chId,
                questions: shuffleArray(baseQ),
                currentIndex: 0,
                correctCount: 0,
                currentCombo: 0,
                maxCombo: 0,
                earnedXp: 0,
                answered: false
            };
            showScreen('quiz');
            renderCurrentQuestion();
        }

        function startMode(modeType) {
            if (modeType === 'final') {
                // Collect 100 questions (80 core + duplicated shuffled for 100 speed challenge)
                let all80 = [];
                Object.values(quizDatabase).forEach(list => all80.push(...list));
                let pool = shuffleArray(all80);
                // Expand to exactly 100 questions
                while (pool.length < 100) {
                    pool.push(...shuffleArray(all80));
                }
                pool = pool.slice(0, 100);

                currentSession = {
                    mode: 'final',
                    chapterId: 0,
                    questions: pool,
                    currentIndex: 0,
                    correctCount: 0,
                    currentCombo: 0,
                    maxCombo: 0,
                    earnedXp: 0,
                    answered: false
                };
                showScreen('quiz');
                renderCurrentQuestion();
            } else if (modeType === 'weak') {
                if (gameState.weakList.length === 0) {
                    showModal("弱点問題なし", "現在、間違えた問題の記録はありません！素晴らしいです。", [
                        { text: "OK", class: "bg-sky-600 text-white w-full py-3 rounded-xl font-bold", action: closeModal }
                    ]);
                    return;
                }
                currentSession = {
                    mode: 'weak',
                    chapterId: 0,
                    questions: shuffleArray(gameState.weakList),
                    currentIndex: 0,
                    correctCount: 0,
                    currentCombo: 0,
                    maxCombo: 0,
                    earnedXp: 0,
                    answered: false
                };
                showScreen('quiz');
                renderCurrentQuestion();
            }
        }

        function renderCurrentQuestion() {
            const qData = currentSession.questions[currentSession.currentIndex];
            currentSession.answered = false;

            // Reset Card & Explanations UI
            const explanationCard = document.getElementById('explanation-card');
            explanationCard.classList.add('hidden');

            // Header info
            const badge = document.getElementById('quiz-chapter-badge');
            if (currentSession.mode === 'chapter') {
                badge.innerText = `第${currentSession.chapterId}節`;
            } else if (currentSession.mode === 'final') {
                badge.innerText = `総まとめ100問`;
            } else {
                badge.innerText = `弱点克服`;
            }

            document.getElementById('quiz-question-num').innerText = `問 ${currentSession.currentIndex + 1} / ${currentSession.questions.length}`;

            // Progress bar
            const pct = (currentSession.currentIndex / currentSession.questions.length) * 100;
            document.getElementById('quiz-progress-bar').style.width = `${pct}%`;

            // Combo display
            const comboContainer = document.getElementById('combo-container');
            if (currentSession.currentCombo >= 2) {
                comboContainer.classList.remove('hidden');
                comboContainer.classList.add('flex');
                document.getElementById('combo-count').innerText = currentSession.currentCombo;
            } else {
                comboContainer.classList.add('hidden');
                comboContainer.classList.remove('flex');
            }

            // Render Question Text
            document.getElementById('question-text').innerText = qData.q;

            // Render Choices (Shuffle choices while keeping track of correct index)
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            // Create choice objects with original indices
            const choices = qData.options.map((opt, idx) => ({ text: opt, isCorrect: idx === qData.ans }));
            const shuffledChoices = shuffleArray(choices);

            shuffledChoices.forEach((c) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 shadow-sm hover:border-sky-500 dark:hover:border-sky-400 active:scale-98 transition flex items-center justify-between font-bold text-sm md:text-base text-slate-800 dark:text-slate-100 touch-action-manipulation choice-btn`;
                btn.innerHTML = `
                    <span class="leading-relaxed">${c.text}</span>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0 ml-2 choice-indicator"></div>
                `;
                btn.onclick = () => handleAnswer(c.isCorrect, btn, qData);
                choicesContainer.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect, clickedBtn, qData) {
            if (currentSession.answered) return;
            currentSession.answered = true;

            const explanationCard = document.getElementById('explanation-card');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackSubtitle = document.getElementById('feedback-subtitle');
            const explanationText = document.getElementById('explanation-text');

            // Disable all choice buttons
            const choiceBtns = document.querySelectorAll('.choice-btn');
            choiceBtns.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            });

            // Tracking key
            const qKey = qData.q;
            if (!gameState.history[qKey]) gameState.history[qKey] = { correct: 0, wrong: 0 };

            if (isCorrect) {
                // Correct Flow
                sound.playCorrect();
                currentSession.correctCount++;
                currentSession.currentCombo++;
                if (currentSession.currentCombo > currentSession.maxCombo) {
                    currentSession.maxCombo = currentSession.currentCombo;
                }

                // XP & Score calculation
                const comboBonus = Math.min(currentSession.currentCombo * 5, 25);
                const gainedXp = 10 + comboBonus;
                currentSession.earnedXp += gainedXp;
                gameState.score += 100 + (currentSession.currentCombo * 20);
                gameState.streak++;
                if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;

                gameState.history[qKey].correct++;
                // Remove from weak list if previously present
                gameState.weakList = gameState.weakList.filter(w => w.q !== qData.q);

                // Styling clicked button
                clickedBtn.classList.remove('border-slate-200', 'dark:border-slate-700', 'opacity-70');
                clickedBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-900/30', 'text-emerald-700', 'dark:text-emerald-300', 'animate-bounce-short');
                clickedBtn.querySelector('.choice-indicator').innerHTML = '<i class="fa-solid fa-check text-emerald-600 dark:text-emerald-400"></i>';

                // Setup feedback card
                explanationCard.className = "rounded-2xl p-5 space-y-3 transition-all duration-300 border bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-100 animate-pop mt-4";
                feedbackIcon.className = "w-10 h-10 rounded-full flex items-center justify-center text-white text-xl font-bold bg-emerald-500";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                feedbackTitle.innerText = currentSession.currentCombo > 2 ? `正解！ (${currentSession.currentCombo} COMBO!)` : "正解！";
                feedbackSubtitle.innerText = `+${gainedXp} XP 獲得！`;

            } else {
                // Wrong Flow
                sound.playWrong();
                currentSession.currentCombo = 0;
                gameState.streak = 0;
                gameState.history[qKey].wrong++;

                // Add to weak list if not already
                if (!gameState.weakList.some(w => w.q === qData.q)) {
                    gameState.weakList.push(qData);
                }

                // Card Shake Effect
                document.getElementById('question-card').classList.add('animate-shake');
                setTimeout(() => document.getElementById('question-card').classList.remove('animate-shake'), 400);

                // Highlight clicked button as wrong
                clickedBtn.classList.remove('border-slate-200', 'dark:border-slate-700', 'opacity-70');
                clickedBtn.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-900/30', 'text-rose-700', 'dark:text-rose-300');
                clickedBtn.querySelector('.choice-indicator').innerHTML = '<i class="fa-solid fa-xmark text-rose-600 dark:text-rose-400"></i>';

                // Setup feedback card
                explanationCard.className = "rounded-2xl p-5 space-y-3 transition-all duration-300 border bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800 text-rose-900 dark:text-rose-100 animate-pop mt-4";
                feedbackIcon.className = "w-10 h-10 rounded-full flex items-center justify-center text-white text-xl font-bold bg-rose-500";
                feedbackIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                feedbackTitle.innerText = "不正解...";
                feedbackSubtitle.innerText = "解説を確認してマスターしよう！";
            }

            explanationText.innerHTML = `<strong>【解説】</strong><br>${qData.exp}`;
            explanationCard.classList.remove('hidden');

            // XP Level Up Check
            addXp(isCorrect ? 10 : 0);
            saveState();
            updateHeaderUI();
        }

        function addXp(amount) {
            const oldLevel = gameState.level;
            gameState.xp += amount;
            gameState.level = Math.floor(gameState.xp / 100) + 1;

            if (gameState.level > oldLevel) {
                sound.playLevelUp();
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
                showModal("LEVEL UP!", `おめでとうございます！ Level ${gameState.level} に到達しました！\n称号: 【${getLevelTitle(gameState.level)}】`, [
                    { text: "やったー！", class: "bg-amber-500 text-white w-full py-3 rounded-xl font-bold", action: closeModal }
                ]);
            }
        }

        function nextQuestion() {
            currentSession.currentIndex++;
            if (currentSession.currentIndex < currentSession.questions.length) {
                renderCurrentQuestion();
            } else {
                finishQuizSession();
            }
        }

        function finishQuizSession() {
            sound.playFanfare();
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });

            const total = currentSession.questions.length;
            const correct = currentSession.correctCount;
            const accuracy = Math.round((correct / total) * 100);

            document.getElementById('result-accuracy').innerText = `${accuracy}%`;
            document.getElementById('result-xp').innerText = `+${currentSession.earnedXp}`;
            document.getElementById('result-max-combo').innerText = `${currentSession.maxCombo}`;
            document.getElementById('result-score-detail').innerText = `${total}問中 ${correct}問正解`;

            if (accuracy === 100) {
                document.getElementById('result-title').innerText = "PERFECT!! 全問正解！";
                document.getElementById('result-subtitle').innerText = "パーフェクト達成！完璧な理解度です！";
                document.getElementById('result-badge-icon').className = "fa-solid fa-crown text-amber-500 text-4xl";
            } else if (accuracy >= 80) {
                document.getElementById('result-title').innerText = "素晴らしい成績！";
                document.getElementById('result-subtitle').innerText = "合格ラインを余裕でクリアしています！";
                document.getElementById('result-badge-icon').className = "fa-solid fa-trophy text-amber-500 text-4xl";
            } else {
                document.getElementById('result-title').innerText = "トレーニング完了！";
                document.getElementById('result-subtitle').innerText = "復習して弱点を克服していきましょう！";
                document.getElementById('result-badge-icon').className = "fa-solid fa-medal text-sky-500 text-4xl";
            }

            showScreen('result');
            saveState();
        }

        function retryCurrentQuiz() {
            if (currentSession.mode === 'chapter') {
                startChapterQuiz(currentSession.chapterId);
            } else {
                startMode(currentSession.mode);
            }
        }

        function confirmExitQuiz() {
            showModal("中断の確認", "学習を途中で終了してホームに戻りますか？", [
                { text: "続ける", class: "bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 flex-1 py-2.5 rounded-xl font-bold", action: closeModal },
                { text: "ホームへ戻る", class: "bg-rose-600 text-white flex-1 py-2.5 rounded-xl font-bold", action: () => { closeModal(); showScreen('home'); } }
            ]);
        }

        /* ==========================================================================
           DICTIONARY / GLOSSARY ENGINE
           ========================================================================== */
        let activeDictCategory = 'all';

        function setDictCategory(cat) {
            activeDictCategory = cat;
            document.querySelectorAll('.dict-tab').forEach(btn => {
                btn.classList.remove('bg-sky-600', 'text-white');
                btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
            });
            event.target.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
            event.target.classList.add('bg-sky-600', 'text-white');
            filterDictionary();
        }

        function filterDictionary() {
            const query = document.getElementById('dict-search-input').value.toLowerCase().trim();
            const container = document.getElementById('dictionary-list');
            container.innerHTML = '';

            let list = [];
            if (activeDictCategory === 'all') {
                Object.values(quizDatabase).forEach(arr => list.push(...arr));
            } else {
                list = quizDatabase[activeDictCategory] || [];
            }

            // Filter search
            if (query) {
                list = list.filter(item => item.q.toLowerCase().includes(query) || item.exp.toLowerCase().includes(query) || item.options[item.ans].toLowerCase().includes(query));
            }

            if (list.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm">該当する用語が見つかりませんでした。</p>`;
                return;
            }

            list.forEach(item => {
                const termName = item.options[item.ans];
                const key = item.q;
                const history = gameState.history[key];
                const isMastered = history && history.correct > 0;

                const card = document.createElement('div');
                card.className = "p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-base text-sky-600 dark:text-sky-400">${termName}</span>
                            ${isMastered ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300"><i class="fa-solid fa-check"></i> 習得済み</span>' : ''}
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400">${item.q}</p>
                    <p class="text-xs text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/50 leading-relaxed">${item.exp}</p>
                `;
                container.appendChild(card);
            });
        }

        function renderDictionary() {
            filterDictionary();
        }

        /* ==========================================================================
           MODAL DIALOG SYSTEM
           ========================================================================== */
        function showModal(title, message, buttons = []) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');

            let btnHtml = buttons.map((b, idx) => `<button id="modal-btn-${idx}" class="${b.class}">${b.text}</button>`).join('');

            content.innerHTML = `
                <h3 class="font-black text-xl text-slate-800 dark:text-slate-100">${title}</h3>
                <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line">${message}</p>
                <div class="flex space-x-2 pt-2">${btnHtml}</div>
            `;

            buttons.forEach((b, idx) => {
                document.getElementById(`modal-btn-${idx}`).onclick = b.action;
            });

            overlay.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        /* ==========================================================================
           INITIALIZATION
           ========================================================================== */
        window.onload = function() {
            loadSavedState();

            // Sound Toggle Handler
            document.getElementById('sound-toggle-btn').onclick = function() {
                sound.enabled = !sound.enabled;
                const icon = document.getElementById('sound-icon');
                if (sound.enabled) {
                    icon.className = "fa-solid fa-volume-high text-sky-600";
                    sound.playCorrect();
                } else {
                    icon.className = "fa-solid fa-volume-xmark text-slate-400";
                }
            };
        };
    </script>
</body>
</html>
